name: Build Debug APK

# 触发：push 到 main / 手动点击
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 拉取源码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装编译所需的 SDK 组件
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: 安装 Gradle 8.7 并生成 wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 生成 Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: 编译 Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 确认 APK 产物
        run: |
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: 上传 APK 为 Actions 产物（可下载）
        uses: actions/upload-artifact@v4
        with:
          name: propscheck-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: 发布到 Release（免登录直链下载）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: 道具核对 · Debug 版
          body: |
            拍摄道具服装核对助手 V0.3 — 自动构建的 Debug APK。

            安装：下载 app-debug.apk 到手机，点击安装（需允许「未知来源」）。
            首次启动请允许通知权限，否则闹钟不弹。
            国产 ROM（小米/华为/OPPO）请把 App 加入电池优化白名单。
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
