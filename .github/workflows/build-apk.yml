name: Build Debug APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 使用 ubuntu 镜像预装的 Android SDK，不联网下载
      - name: 配置 Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          mkdir -p /usr/local/lib/android/sdk/licenses
          echo "24333f8a63b6825ea9c5514f83c24dc9eb0be1aa" > /usr/local/lib/android/sdk/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > /usr/local/lib/android/sdk/licenses/android-sdk-preview-license
          ls /usr/local/lib/android/sdk/platforms
          ls /usr/local/lib/android/sdk/build-tools

      - name: 生成 Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: 编译 Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: propscheck-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: 道具核对 · Debug 版
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
